# Example of how n8n-homepage-api would be deployed in a normal Compose setup
# (Note that this is an incomplete config, particularly in relation to Traefik)

# Environment variables to set:
# - POSTGRES_PASSWORD
# - POSTGRES_NON_ROOT_PASSWORD
# - ENCRYPTION_KEY, made with "openssl rand -hex 32"

x-common:
  TIMEZONE: &timezone "America/Los_Angeles"
  POSTGRES: &postgres
    POSTGRES_USER: &postgres_user "postgres"
    POSTGRES_NON_ROOT_USER: &postgres_non_root_user "postgres_nonroot"
    POSTGRES_DB: &postgres_db "n8n"

services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    ports:
      - "5432:5432"
    environment:
      <<: *postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_NON_ROOT_PASSWORD: "${POSTGRES_NON_ROOT_PASSWORD}"
    volumes:
      - db-storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh # See: https://github.com/AnarchoBooleanism/saphnet-compose-configs/blob/main/n8n/init-data.sh
    networks:
      - n8n_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres -d n8n'] # Be sure to update this to reflect POSTGRES_USER and POSTGRES_DB!
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  n8n:
    image: n8nio/n8n:stable
    container_name: n8n
    depends_on:
      postgres:
        condition: service_healthy
    # ports:
    #   - "5678:5678"
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: Host(`n8n.example.com`)
      traefik.http.routers.n8n.tls: "true"
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: letsencrypt
      traefik.http.routers.n8n.tls.domains[0].main: n8n.example.com
      traefik.http.middlewares.n8n.headers.SSLRedirect: "true"
      traefik.http.middlewares.n8n.headers.STSSeconds: "315360000"
      traefik.http.middlewares.n8n.headers.browserXSSFilter: "true"
      traefik.http.middlewares.n8n.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.n8n.headers.forceSTSHeader: "true"
      traefik.http.middlewares.n8n.headers.SSLHost: example.com
      traefik.http.middlewares.n8n.headers.STSIncludeSubdomains: "true"
      traefik.http.middlewares.n8n.headers.STSPreload: "true"
      traefik.http.routers.n8n.middlewares: n8n@docker
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: *postgres_db
      DB_POSTGRESDB_USER: *postgres_non_root_user
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_NON_ROOT_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Other
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: n8n.example.com
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.example.com/
      GENERIC_TIMEZONE: *timezone
      TZ: *timezone
    volumes:
      - n8n-storage:/home/node/.n8n
    networks:
      - n8n_internal
    restart: unless-stopped

  n8n-homepage-api: # Our service over here!
    image: ghcr.io/anarchobooleanism/n8n-homepage-api:latest
    container_name: n8n-postgres
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n-homepage-api.rule: Host(`n8n.example.com`) && Path(`/api/homepage-custom`)
      traefik.http.routers.n8n-homepage-api.tls: "true"
      traefik.http.routers.n8n-homepage-api.entrypoints: websecure
      traefik.http.routers.n8n-homepage-api.tls.certresolver: letsencrypt
      traefik.http.routers.n8n-homepage-api.tls.domains[0].main: n8n.example.com
      traefik.http.middlewares.n8n-homepage-api-stripprefix.stripprefix.prefixes: /api/homepage-custom # Since our API listens at "/", we need to strip our path prefix out for it to work properly
      traefik.http.routers.n8n-homepage-api.middlewares: n8n-homepage-api-stripprefix
      traefik.http.routers.n8n-homepage-api.service: n8n-homepage-api-svc
      traefik.http.services.n8n-homepage-api-svc.loadbalancer.server.port: "8000" # FastAPI listens to 8000 by default
    environment:
      FASTAPI_PORT: "8000"
      POSTGRES_USER: *postgres_non_root_user
      POSTGRES_PASSWORD: "${POSTGRES_NON_ROOT_PASSWORD}"
      POSTGRES_HOST: n8n-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: *postgres_db
      ROOT_PATH_PREFIX: "/api/homepage-custom" # Since Traefik serves the API at a custom path, we need to pass this to FastAPI so it can be aware of it
    networks:
      - n8n_internal
    restart: unless-stopped

volumes:
  db-storage:
  n8n-storage:

networks:
  n8n_internal:
