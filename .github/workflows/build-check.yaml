name: Docker build check
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths-ignore:
      - '.github/**' # Avoid issues with .github files
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

jobs:
  build-container:
    name: Check whether Docker image builds properly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Try building Docker image
        run: docker build -t n8n-homepage-api-build-test .
